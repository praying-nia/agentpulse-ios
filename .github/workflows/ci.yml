name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: macOS and iOS builds
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check repository hygiene
        shell: bash
        run: |
          test -s README.md
          git show --check --format= HEAD

      - name: Build macOS app
        run: xcodebuild -project AgentPulse.xcodeproj -scheme AgentPulse -destination 'platform=macOS' -derivedDataPath build/macOS CODE_SIGNING_ALLOWED=NO build

      - name: Build with iPhone SDK
        run: xcodebuild -project AgentPulse.xcodeproj -target AgentPulse -sdk iphoneos -configuration Debug SYMROOT="$PWD/build/iOS" CODE_SIGNING_ALLOWED=NO build

      - name: Create CI source snapshot
        id: snapshot
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/${GITHUB_REPOSITORY#*/}-${GITHUB_SHA::12}-source.tar.gz"
          tar --exclude='.git' --exclude='.git/*' --exclude='./build' -czf "$archive" .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload CI source artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.event.repository.name }}-source-${{ github.sha }}
          path: ${{ steps.snapshot.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
